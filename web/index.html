<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ALMASAFETY — construction and facility safety management for JV ALMA CIS: daily safety meetings, hazards, corrective actions and safety learning.">
  <meta name="theme-color" content="#0B4F6C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ALMASAFETY">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ALMASAFETY</title>
  <!-- The browser offers installing from this manifest itself: an install
       icon in the address bar (Chrome, Edge) or its own Install prompt
       (Android). The app adds no install button of its own. -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- A clicked notification opens its page in this window (sent by
       firebase-messaging-sw.js). -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (event) {
        var data = event.data;
        if (data && data.type === 'almasafety-open' &&
            /^\/[a-z-]+$/.test(data.route)) {
          window.location.hash = data.route;
        }
      });
      navigator.serviceWorker.startMessages();
    }
  </script>
  <!-- Keeps the app opening with weak or no signal (see offline_sw.js). -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('offline_sw.js').catch(function (e) {
          console.warn('Offline support unavailable:', e);
        });
      });
    }
  </script>
</body>
</html>
